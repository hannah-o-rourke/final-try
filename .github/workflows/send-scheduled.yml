name: Send Scheduled SMS Messages

on:
  schedule:
    # Runs at 17:55 UTC every day
    - cron: '19 18 * * *'
  # Allow manual trigger
  workflow_dispatch:

jobs:
  send-sms:
    runs-on: ubuntu-latest
    
    steps:
      - name: Call scheduled-sms endpoint
        run: |
          curl -X GET "https://final-try-git-master-hannahs-projects-0a533762.vercel.app/api/scheduled-sms?limit=1"
      
      - name: Report status
        if: ${{ always() }}
        run: echo "SMS sending job completed"